<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Colour Palette Generator</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f9f9f9; }
    #swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 12px; margin: 1.5rem 0; }
    .swatch { height: 90px; border-radius: 8px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; cursor: pointer; transition: transform 0.1s; }
    .swatch:hover { transform: scale(1.05); }
    .swatch span { font-size: 11px; font-weight: 500; }
    #hexList { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-family: monospace; }
    #copyMsg { font-size: 13px; color: #888; margin-top: 12px; min-height: 18px; }
    .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    button { padding: 0 16px; height: 36px; border: 1px solid #ccc; background: white; border-radius: 8px; cursor: pointer; font-size: 14px; }
    button:hover { background: #f0f0f0; }
  </style>
</head>
<body>

  <div class="controls">
    <label style="font-size:14px;">Base colour</label>
    <input type="color" id="baseColor" value="#6366f1" style="width:48px;height:36px;border-radius:8px;cursor:pointer;" />
    <button onclick="generatePalette()">Generate palette</button>
    <button onclick="randomColor()">&#x21BA; Random</button>
  </div>

  <div id="swatches"></div>
  <div id="hexList"></div>
  <p id="copyMsg"></p>

  <script>
    function hexToHsl(hex) {
      let r = parseInt(hex.slice(1,3),16)/255;
      let g = parseInt(hex.slice(3,5),16)/255;
      let b = parseInt(hex.slice(5,7),16)/255;
      let max = Math.max(r,g,b), min = Math.min(r,g,b);
      let h, s, l = (max+min)/2;
      if (max === min) { h = s = 0; }
      else {
        let d = max - min;
        s = l > 0.5 ? d/(2-max-min) : d/(max+min);
        switch(max) {
          case r: h = ((g-b)/d + (g<b?6:0))/6; break;
          case g: h = ((b-r)/d + 2)/6; break;
          case b: h = ((r-g)/d + 4)/6; break;
        }
      }
      return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
    }

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      let c = (1 - Math.abs(2*l-1)) * s;
      let x = c * (1 - Math.abs((h/60)%2 - 1));
      let m = l - c/2;
      let r=0,g=0,b=0;
      if (h<60){r=c;g=x;}
      else if(h<120){r=x;g=c;}
      else if(h<180){g=c;b=x;}
      else if(h<240){g=x;b=c;}
      else if(h<300){r=x;b=c;}
      else{r=c;b=x;}
      const toHex = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

    function getLightness(hex) {
      let r = parseInt(hex.slice(1,3),16)/255;
      let g = parseInt(hex.slice(3,5),16)/255;
      let b = parseInt(hex.slice(5,7),16)/255;
      return 0.299*r + 0.587*g + 0.114*b;
    }

    function generatePalette() {
      const base = document.getElementById('baseColor').value;
      const [h, s] = hexToHsl(base);
      const lightnesses = [95, 85, 70, 55, 40, 25, 10];
      const labels = ['50','100','200','400','500','700','900'];
      const colors = lightnesses.map(l => hslToHex(h, Math.min(s, 90), l));

      const swatches = document.getElementById('swatches');
      const hexList = document.getElementById('hexList');
      swatches.innerHTML = '';
      hexList.innerHTML = '';

      colors.forEach((color, i) => {
        const textColor = getLightness(color) > 0.5 ? '#1a1a1a' : '#f5f5f5';
        const div = document.createElement('div');
        div.className = 'swatch';
        div.style.background = color;
        div.innerHTML = `<span style="color:${textColor}">${labels[i]}</span>`;
        div.title = color;
        div.onclick = () => copyToClipboard(color);
        swatches.appendChild(div);

        const pill = document.createElement('span');
        pill.className = 'pill';
        pill.style.cssText = `background:${color}; color:${textColor};`;
        pill.textContent = color;
        pill.onclick = () => copyToClipboard(color);
        hexList.appendChild(pill);
      });
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const msg = document.getElementById('copyMsg');
        msg.textContent = `Copied ${text}!`;
        setTimeout(() => msg.textContent = '', 2000);
      });
    }

    function randomColor() {
      const h = Math.floor(Math.random() * 360);
      const hex = hslToHex(h, 70, 50);
      document.getElementById('baseColor').value = hex;
      generatePalette();
    }

    generatePalette();
  </script>
</body>
</html>
